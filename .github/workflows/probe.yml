name: probe
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe2
        run: |
          mkdir -p data/_probe && cd data/_probe
          try(){ n="$1"; u="$2"; c=$(curl -sL -o "$n" -w "%{http_code}" --max-time 30 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" "$u"); echo "$n $c $(wc -c < $n)" >> report2.txt; }
          try nfl2027.html "https://www.nfl.com/schedules/2027/REG/"
          try nfl2026reg.html "https://www.nfl.com/schedules/2026/REG/"
          try stan2027.json "https://gostanford.com/api/v2/sports/football/schedule?season=2027"
          try stan2026.json "https://gostanford.com/api/v2/sports/football/schedule?season=2026"
          try cal2027.json "https://calbears.com/api/v2/sports/football/schedule?season=2027"
          try cal2026.json "https://calbears.com/api/v2/sports/football/schedule?season=2026"
          try wwo_types.json "https://www.westwoodonesports.com/wp-json/wp/v2/types"
          try wwo_sched.json "https://www.westwoodonesports.com/wp-json/socast/v1/schedule"
          try mlb2028.json "https://statsapi.mlb.com/api/v1/schedule?sportId=1&startDate=2028-04-01&endDate=2028-04-05"
          try mlb2029.json "https://statsapi.mlb.com/api/v1/schedule?sportId=1&startDate=2029-04-01&endDate=2029-04-05"
          try mlb2027full.json "https://statsapi.mlb.com/api/v1/schedule?sportId=1&season=2027&gameTypes=R,F,D,L,W"
          try espn_sf.json "https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/sf/schedule?season=2026"
          try espn_stan.json "https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/stanford/schedule?season=2026"
          try espn_cal.json "https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/cal/schedule?season=2026"
          try knbr.html "https://www.knbr.com/giants-schedule/"
          try wwo_ncaaf.html "https://www.westwoodonesports.com/ncaa-football-schedule/"
          try mlbsched2027.html "https://www.mlb.com/schedule/2027-04-01"
      - name: commit
        run: |
          git config user.name "probe-bot"; git config user.email "probe@example.com"
          git add -A; git commit -q -m "probe2 results" || true; git push -q || true
