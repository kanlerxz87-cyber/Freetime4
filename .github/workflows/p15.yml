name: p15-wwo
on: {workflow_dispatch: {}, push: {paths: [".github/workflows/p15.yml"]}}
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import os,re,json,urllib.request,ssl
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          OUT="data/raw/wwo_events"; os.makedirs(OUT,exist_ok=True)
          lst=json.load(open("data/wwo_events_list.json"))
          print("to fetch:",len(lst))
          ok=miss=err=0
          for e in lst:
              href=e["href"]; fn=os.path.join(OUT, href.strip("/").replace("/","_")+".json")
              if os.path.exists(fn): ok+=1; continue
              url="https://www.westwoodonesports.com"+href
              try:
                  r=urllib.request.Request(url,headers={"User-Agent":UA})
                  with urllib.request.urlopen(r,timeout=20,context=ssl.create_default_context()) as f: b=f.read().decode("utf-8","ignore")
                  m=re.search(r'<script type="application/ld\+json">\s*(\{.*?"@type"\s*:\s*"Event".*?\})\s*</script>',b,flags=re.S)
                  if not m: miss+=1; continue
                  json.dump({"href":href,"url":url,"ld":json.loads(m.group(1))},open(fn,"w")); ok+=1
              except Exception: err+=1
          print("ok",ok,"missing",miss,"err",err)
          PY
      - run: |
          git config user.name c; git config user.email c@x
          git add -f data/raw/wwo_events
          git commit -q -m "wwo event details" || echo "nothing"
          git push -q || true
