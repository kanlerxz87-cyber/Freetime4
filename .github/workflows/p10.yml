name: probe10
on: {workflow_dispatch: {}, push: {paths: ["scripts/probe10.py", ".github/workflows/p10.yml"]}}
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe10.py
      - run: |
          git config user.name c; git config user.email c@x
          git add -A data; git commit -q -m "probe10" || true; git push -q || true
