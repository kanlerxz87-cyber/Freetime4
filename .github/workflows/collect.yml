name: collect-schedules
on:
  workflow_dispatch:
  push:
    paths: ["scripts/collect.py", ".github/workflows/collect.yml"]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: run collector
        run: python3 scripts/collect.py
      - name: commit
        run: |
          git config user.name "schedule-collector"; git config user.email "collector@users.noreply.github.com"
          git add -A data
          git commit -q -m "data: official schedule collection $(date -u +%FT%TZ)" || echo "no changes"
          git push -q || true
