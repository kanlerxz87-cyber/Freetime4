name: Validate Bay Area Gameplan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate schedule data
        run: python3 -m json.tool site/data/schedules.json >/dev/null
      - name: Check JavaScript syntax
        run: |
          node --check site/assets/app.js
          node --check site/assets/category.js
      - name: Build static site
        run: python3 scripts/build_site.py
      - name: Check patch whitespace
        run: git diff --check
