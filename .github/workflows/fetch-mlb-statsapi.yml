name: Fetch official schedule data

# Bulk-fetches official schedule data from MLB's public Stats API and ESPN's
# public site API (cross-check source) into data/raw/ and commits it to this
# branch. The sandbox working on this repo cannot reach these hosts directly,
# but GitHub Actions runners can. Triggered manually (workflow_dispatch).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch MLB schedules (official MLB Stats API)
        run: |
          set -eux
          mkdir -p data/raw
          fetch() { curl -sS --retry 3 --retry-delay 2 --max-time 60 -o "$2" "$1" && echo "ok $2 $(wc -c <"$2")"; }
          # MLB 2027: spring training (Feb), regular season (Mar-Sep), postseason (Oct/Nov once scheduled)
          # month:startDate,endDate (valid calendar end dates only)
          for r in "02:2027-02-01,2027-02-28" "03:2027-03-01,2027-03-31" "04:2027-04-01,2027-04-30" \
                   "05:2027-05-01,2027-05-31" "06:2027-06-01,2027-06-30" "07:2027-07-01,2027-07-31" \
                   "08:2027-08-01,2027-08-31" "09:2027-09-01,2027-09-30" "10:2027-10-01,2027-10-31" \
                   "11:2027-11-01,2027-11-30"; do
            m="${r%%:*}"; range="${r#*:}"; s="${range%,*}"; e="${range#*,}"
            fetch "https://statsapi.mlb.com/api/v1/schedule?sportId=1&startDate=${s}&endDate=${e}" "data/raw/mlb_2027_${m}.json"
          done
          # MLB 2028 / 2029 (usually empty until released — captured anyway for the record)
          for r in "03:2028-03-01,2028-03-31" "04:2028-04-01,2028-04-30" "05:2028-05-01,2028-05-31" \
                   "06:2028-06-01,2028-06-30" "07:2028-07-01,2028-07-31" "08:2028-08-01,2028-08-31" \
                   "09:2028-09-01,2028-09-30" "10:2028-10-01,2028-10-31" "11:2028-11-01,2028-11-30" \
                   "03:2029-03-01,2029-03-31" "04:2029-04-01,2029-04-30" "05:2029-05-01,2029-05-31" \
                   "06:2029-06-01,2029-06-30" "07:2029-07-01,2029-07-31" "08:2029-08-01,2029-08-31" \
                   "09:2029-09-01,2029-09-30" "10:2029-10-01,2029-10-31" "11:2029-11-01,2029-11-30"; do
            m="${r%%:*}"; range="${r#*:}"; s="${range%,*}"; e="${range#*,}"; y="${s%%-*}"
            fetch "https://statsapi.mlb.com/api/v1/schedule?sportId=1&startDate=${s}&endDate=${e}" "data/raw/mlb_${y}_${m}.json"
          done
          # MLB 2026 tail (postseason record + offseason confirmation)
          for r in "09:2026-09-01,2026-09-30" "10:2026-10-01,2026-10-31" "11:2026-11-01,2026-11-30"; do
            m="${r%%:*}"; range="${r#*:}"; s="${range%,*}"; e="${range#*,}"
            fetch "https://statsapi.mlb.com/api/v1/schedule?sportId=1&startDate=${s}&endDate=${e}" "data/raw/mlb_2026_${m}.json"
          done

      - name: Fetch NFL + college football (ESPN site API, cross-check source)
        run: |
          set -eux
          mkdir -p data/raw
          fetch() { curl -sS --retry 3 --retry-delay 2 --max-time 60 -o "$2" "$1" && echo "ok $2 $(wc -c <"$2")"; }
          # NFL 2026 season: weeks 1-18 (reg) + postseason weeks
          for w in $(seq 1 18); do
            fetch "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?season=2026&seasontype=2&week=${w}" "data/raw/nfl_2026_reg_w${w}.json"
          done
          for w in $(seq 1 5); do
            fetch "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?season=2026&seasontype=3&week=${w}" "data/raw/nfl_2026_post_w${w}.json"
          done
          # NFL future seasons (2027-2029): whatever exists now (preseason/reg once released)
          for y in 2027 2028 2029; do
            for st in 1 2 3; do
              for w in $(seq 1 19); do
                fetch "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?season=${y}&seasontype=${st}&week=${w}" "data/raw/nfl_${y}_st${st}_w${w}.json"
              done
            done
          done
          # NFL 49ers full team schedules (all seasons) — includes preseason once posted
          for y in 2026 2027 2028 2029; do
            fetch "https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/29/schedule?season=${y}" "data/raw/nfl_49ers_${y}.json"
          done
          # Stanford (ESPN team 24) and California (ESPN team 25) football schedules
          for y in 2026 2027 2028 2029; do
            fetch "https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/24/schedule?season=${y}" "data/raw/cfb_stanford_${y}.json"
            fetch "https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/25/schedule?season=${y}" "data/raw/cfb_cal_${y}.json"
          done

      - name: Commit raw data
        run: |
          git config user.name "schedule-fetch-bot"
          git config user.email "schedule-fetch-bot@users.noreply.github.com"
          git add data/raw
          git commit -m "data: bulk-fetch official MLB statsapi + ESPN cross-check schedules" || echo "nothing to commit"
          git push origin HEAD:arena/ad020434-freetime4
