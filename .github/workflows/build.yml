name: build-and-publish
on:
  workflow_dispatch:
  push:
    paths: ["scripts/**", "config/**", "data/raw/**", ".github/workflows/build.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Build dataset from the official raw responses
        run: |
          python3 scripts/build.py
          python3 scripts/espn_crosscheck.py
          python3 scripts/estimate.py
          python3 scripts/analyze.py

      - name: Verify (fails on any invented / unsourced row)
        run: python3 scripts/verify.py

      - name: Publish to repo root (GitHub Pages serves main /)
        run: python3 scripts/publish.py

      - name: Link check
        run: python3 scripts/check_links.py

      - name: Commit the rebuilt data + pages
        run: |
          git config user.name "schedule-builder"
          git config user.email "builder@users.noreply.github.com"
          git add -A . ':!data/raw'
          git commit -q -m "build: regenerate data/site.json + pages" || echo "no changes"
          git push || echo "push skipped"
