name: Fetch official schedules

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * 1" # weekly refresh (picks up newly released schedules, e.g. NFL each May, MLB each summer)

permissions:
  contents: write

concurrency:
  group: fetch-schedules
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official schedule data
        run: python scripts/fetch_official_schedules.py

      - name: Commit fetched data
        run: |
          git config user.name "schedule-fetch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(data): refresh official schedule fetch [skip ci]"
          git pull --rebase origin "$BRANCH" || true
          git push origin "HEAD:$BRANCH"
        env:
          BRANCH: ${{ github.ref_name }}
